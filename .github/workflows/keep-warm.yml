name: Keep warm

# Ping /health/live only so the free Render API stays awake without waking Neon.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping live health
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "API_HEALTH_URL is empty; skipping until the Render service exists."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$API_HEALTH_URL" || true)
          echo "HTTP ${code:-000}"
          exit 0
