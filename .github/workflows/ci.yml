name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soko_africa_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soko_africa_test?schema=public
      REQUIRE_INTEGRATION_TESTS: '1'
      API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long-for-tests
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soko_africa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability scan
        # Fails the build on high/critical advisories (H4 in the security
        # review — this is what would have caught the disclosed Next.js CVE
        # before it ever reached a review). Moderate/low findings are
        # tracked separately and don't block CI.
        run: pnpm audit --audit-level high

      - name: Generate Prisma client
        run: pnpm --filter backend exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter backend exec prisma migrate deploy

      - name: Seed isolated test database
        run: pnpm --filter backend run db:seed

      - name: Start test API and wait for database readiness
        run: |
          pnpm --filter backend start > backend-test.log 2>&1 &
          node scripts/wait-for-api.mjs

      - name: Lint frontend
        run: pnpm --filter frontend lint

      - name: Build frontend
        run: pnpm --filter frontend build
        env:
          NODE_ENV: production

      - name: Backend syntax check
        run: |
          node --check apps/backend/app.js
          node --check apps/backend/plugins/mail.js
          node --check apps/backend/lib/order-notifications.js

      - name: Backend tests
        run: pnpm --filter backend test

      - name: Shared units tests
        run: pnpm --filter @soko/units test

      - name: Install browser
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Browser regression tests
        run: pnpm --filter frontend test:e2e

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            backend-test.log
            apps/frontend/test-results/
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
